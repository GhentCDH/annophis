networks:
  annophis-net:
    name: annophis-net

services:
  ms-metadata-frontend:
    build:
      context: .
      dockerfile: apps/ms-metadata/Dockerfile.dev
    env_file: [apps/ms-metadata/.env]
    ports:
      - "${FRONTEND_PORT:-4204}:${FRONTEND_PORT:-4204}"
    environment:
      - BACKEND_HOST=ms-metadata-backend
      - NX_COMMAND=ms-metadata-frontend:dev
      - WATCHPACK_POLLING=true
      - IS_DOCKER=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.nx
    networks: [annophis-net]
  ms-metadata-backend:
    build:
      context: .
      dockerfile: apps/ms-metadata/Dockerfile.dev
    env_file: [apps/ms-metadata/.env]
    ports:
      - "${BACKEND_PORT:-3004}:${BACKEND_PORT:-3004}"
    # The Prisma client is git-ignored: generate it before serving (serve even if it fails, errors show on /crouton/status).
    command: sh -c "pnpm exec crouton generate --yes --cwd apps/ms-metadata; pnpm exec nx run ms-metadata-backend:serve"
    environment:
      - NX_COMMAND=ms-metadata-backend:serve
      - WATCHPACK_POLLING=true
      - IS_DOCKER=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.nx
    networks: [annophis-net]
