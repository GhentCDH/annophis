networks:
  annophis-net:
    name: annophis-net

services:
  ms-metadata-frontend:
    build:
      context: .
      dockerfile: apps/ms-metadata/Dockerfile.dev
    env_file: [apps/ms-metadata/.env]
    ports:
      - "${FRONTEND_PORT:-6204}:${FRONTEND_PORT:-6204}"
    environment:
      - BACKEND_HOST=ms-metadata-backend
      - NX_COMMAND=ms-metadata-frontend:dev
      - WATCHPACK_POLLING=true
      - IS_DOCKER=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.nx
    networks: [annophis-net]
  ms-metadata-backend:
    build:
      context: .
      dockerfile: apps/ms-metadata/Dockerfile.dev
    env_file: [apps/ms-metadata/.env]
    ports:
      - "${BACKEND_PORT:-6104}:${BACKEND_PORT:-6104}"
    # The Prisma client is git-ignored: generate it, apply migrations, then serve (serve even if a step fails; errors show on /crouton/status).
    command: sh -c "pnpm exec crouton generate --yes --cwd apps/ms-metadata; (cd apps/ms-metadata && pnpm exec prisma migrate deploy --config prisma/default/prisma.config.ts); pnpm exec nx run ms-metadata-backend:serve"
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
    environment:
      - NX_COMMAND=ms-metadata-backend:serve
      # .env points at localhost for `pnpm dev`; inside the network use service hostnames
      - DATABASE_URL=postgresql://ms_metadata:dev@postgres:5432/annophis?schema=ms_metadata
      - NATS_URL=nats://nats:4222
      - WATCHPACK_POLLING=true
      - IS_DOCKER=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.nx
    networks: [annophis-net]
