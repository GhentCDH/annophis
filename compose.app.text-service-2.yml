networks:
  annophis-net:
    name: annophis-net

services:
  text-service-2-backend:
    build:
      context: .
      dockerfile: apps/text-service-2/Dockerfile.dev
    env_file: [apps/text-service-2/.env]
    ports:
      - "${BACKEND_PORT:-6111}:${BACKEND_PORT:-6111}"
    # The Prisma client is git-ignored: generate it, apply migrations, then serve (serve even if a step fails; errors show on /crouton/status).
    command: sh -c "pnpm exec crouton generate --yes --cwd apps/text-service-2; (cd apps/text-service-2 && pnpm exec prisma migrate deploy --config prisma/default/prisma.config.ts); pnpm exec nx run text-service-2-backend:serve"
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
    environment:
      - NX_COMMAND=text-service-2-backend:serve
      # .env points at localhost for `pnpm dev`; inside the network use service hostnames
      - DATABASE_URL=postgresql://text_service_2:dev@postgres:5432/annophis?schema=text_service_2
      - NATS_URL=nats://nats:4222
      - WATCHPACK_POLLING=true
      - IS_DOCKER=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.nx
    networks: [annophis-net]
