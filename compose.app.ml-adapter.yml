networks:
  annophis-net:
    name: annophis-net

services:
  ml-adapter-backend:
    build:
      context: .
      dockerfile: apps/ml-adapter/Dockerfile.dev
    env_file: [apps/ml-adapter/.env]
    ports:
      - "${BACKEND_PORT:-3020}:${BACKEND_PORT:-3020}"
    # The Prisma client is git-ignored: generate it before serving (serve even if it fails, errors show on /crouton/status).
    command: sh -c "pnpm exec crouton generate --yes --cwd apps/ml-adapter; pnpm exec nx run ml-adapter-backend:serve"
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
    environment:
      - NX_COMMAND=ml-adapter-backend:serve
      # .env points at localhost for `pnpm dev`; inside the network use service hostnames
      - DATABASE_URL=postgresql://ml_adapter:dev@postgres:5432/annophis?schema=ml_adapter
      - NATS_URL=nats://nats:4222
      - WATCHPACK_POLLING=true
      - IS_DOCKER=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.nx
    networks: [annophis-net]
