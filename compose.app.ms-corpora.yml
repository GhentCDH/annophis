networks:
  annophis-net:
    name: annophis-net

services:
  ms-corpora-frontend:
    build:
      context: .
      dockerfile: apps/ms-corpora/Dockerfile.dev
    env_file: [apps/ms-corpora/.env]
    ports:
      - "${FRONTEND_PORT:-6202}:${FRONTEND_PORT:-6202}"
    environment:
      - BACKEND_HOST=ms-corpora-backend
      - NX_COMMAND=ms-corpora-frontend:dev
      - WATCHPACK_POLLING=true
      - IS_DOCKER=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.nx
    networks: [annophis-net]
  ms-corpora-backend:
    build:
      context: .
      dockerfile: apps/ms-corpora/Dockerfile.dev
    env_file: [apps/ms-corpora/.env]
    ports:
      - "${BACKEND_PORT:-6102}:${BACKEND_PORT:-6102}"
    # The Prisma client is git-ignored: generate it, apply migrations, then serve (serve even if a step fails; errors show on /crouton/status).
    command: sh -c "pnpm exec crouton generate --yes --cwd apps/ms-corpora; (cd apps/ms-corpora && pnpm exec prisma migrate deploy --config prisma/default/prisma.config.ts); pnpm exec nx run ms-corpora-backend:serve"
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
    environment:
      - NX_COMMAND=ms-corpora-backend:serve
      # .env points at localhost for `pnpm dev`; inside the network use service hostnames
      - DATABASE_URL=postgresql://ms_corpora:dev@postgres:5432/annophis?schema=ms_corpora
      - NATS_URL=nats://nats:4222
      - WATCHPACK_POLLING=true
      - IS_DOCKER=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.nx
    networks: [annophis-net]
