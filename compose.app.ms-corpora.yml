networks:
  annophis-net:
    name: annophis-net

services:
  ms-corpora-frontend:
    build:
      context: .
      dockerfile: apps/ms-corpora/Dockerfile.dev
    env_file: [apps/ms-corpora/.env]
    ports:
      - "${FRONTEND_PORT:-4202}:${FRONTEND_PORT:-4202}"
    environment:
      - BACKEND_HOST=ms-corpora-backend
      - NX_COMMAND=ms-corpora-frontend:dev
      - WATCHPACK_POLLING=true
      - IS_DOCKER=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.nx
    networks: [annophis-net]
  ms-corpora-backend:
    build:
      context: .
      dockerfile: apps/ms-corpora/Dockerfile.dev
    env_file: [apps/ms-corpora/.env]
    ports:
      - "${BACKEND_PORT:-3002}:${BACKEND_PORT:-3002}"
    # The Prisma client is git-ignored: generate it before serving (serve even if it fails, errors show on /crouton/status).
    command: sh -c "pnpm exec crouton generate --yes --cwd apps/ms-corpora; pnpm exec nx run ms-corpora-backend:serve"
    environment:
      - NX_COMMAND=ms-corpora-backend:serve
      - WATCHPACK_POLLING=true
      - IS_DOCKER=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.nx
    networks: [annophis-net]
