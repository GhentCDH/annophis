packages:
  - apps/text-service-2/*
  - generated/text-service-2/**
  - '!generated/text-service-2/*/client'
  - apps/text-service-1/*
  - generated/text-service-1/**
  - '!generated/text-service-1/*/client'
  - apps/ms-metadata/*
  - generated/ms-metadata/**
  - '!generated/ms-metadata/*/client'
  - apps/ms-annotation/*
  - generated/ms-annotation/**
  - '!generated/ms-annotation/*/client'
  - apps/ms-corpora/*
  - generated/ms-corpora/**
  - '!generated/ms-corpora/*/client'
  - apps/ms-projects/*
  - generated/ms-projects/**
  - '!generated/ms-projects/*/client'
  - apps/ml-adapter/*
  - generated/ml-adapter/**
  - '!generated/ml-adapter/*/client'
  - apps/gateway/*
  - generated/gateway/**
  - '!generated/gateway/*/client'
  - libs/*

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  '@prisma/engines': true
  '@scarf/scarf': true
  esbuild: true
  nx: true
  prisma: true
  '@nestjs/core': false

minimumReleaseAge: 0

onlyBuiltDependencies:
  - '@swc/core'
  - '@prisma/engines'
  - '@scarf/scarf'
  - esbuild
  - nx
  - prisma

# One supports-color so debug (and with it @nestjs/*) resolves to a single variant;
# otherwise libs/ and the backends load two @nestjs/common copies (breaks DI).
overrides:
  supports-color: 7.2.0
