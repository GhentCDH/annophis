# Builds one production image per service (backend + its admin frontend behind Caddy) on a v* tag,
# pushes ghcr.io/<owner>/annophis-<service>:<version>, then creates a GitHub release from Conventional Commits.
name: Docker

on:
  push:
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  build-and-push:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - ms-projects
          - ms-corpora
          - ms-annotation
          - ms-metadata
          - text-service-1
          - text-service-2
          - ml-adapter

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/annophis-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile.prod
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          CURR="${{ github.ref_name }}"
          PREV=$(git tag --sort=-version:refname | grep -E '^v[0-9]' | sed -n '2p')

          if [ -z "$PREV" ]; then
            LOG=$(git log --pretty=format:"%s" "$CURR")
          else
            LOG=$(git log --pretty=format:"%s" "${PREV}..${CURR}")
          fi

          {
            FEATS=$(echo "$LOG" | grep -E '^feat(\(.+\))?[!]?:' | sed -E 's/^feat(\([^)]+\))?[!]?: /- /' || true)
            FIXES=$(echo "$LOG" | grep -E '^fix(\(.+\))?[!]?:' | sed -E 's/^fix(\([^)]+\))?[!]?: /- /' || true)
            BREAKS=$(echo "$LOG" | grep -E '^.+!:|BREAKING CHANGE' | sed 's/^/- /' || true)
            OTHERS=$(echo "$LOG" | grep -vE '^(feat|fix|chore|refactor|perf|docs|test|build|ci|style|revert)(\(.+\))?[!]?:|^chore: release' || true)

            [ -n "$BREAKS" ] && printf "### ⚠️ Breaking Changes\n%s\n\n" "$BREAKS"
            [ -n "$FEATS" ]  && printf "### 🚀 Features\n%s\n\n" "$FEATS"
            [ -n "$FIXES" ]  && printf "### 🐛 Bug Fixes\n%s\n\n" "$FIXES"
            [ -n "$OTHERS" ] && printf "### 📝 Other\n%s\n\n" "$OTHERS"

            if [ -n "$PREV" ]; then
              printf "**Full changelog**: %s...%s\n" \
                "https://github.com/${{ github.repository }}/compare/${PREV}...${CURR}"
            fi
          } > /tmp/release-notes.md

          cat /tmp/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: /tmp/release-notes.md
          make_latest: true
          draft: false
          prerelease: false
