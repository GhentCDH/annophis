networks:
  annophis-net:
    name: annophis-net

services:
  ms-annotation-frontend:
    build:
      context: .
      dockerfile: apps/ms-annotation/Dockerfile.dev
    env_file: [apps/ms-annotation/.env]
    ports:
      - "${FRONTEND_PORT:-6203}:${FRONTEND_PORT:-6203}"
    environment:
      - BACKEND_HOST=ms-annotation-backend
      - NX_COMMAND=ms-annotation-frontend:dev
      - WATCHPACK_POLLING=true
      - IS_DOCKER=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.nx
    networks: [annophis-net]
  ms-annotation-backend:
    build:
      context: .
      dockerfile: apps/ms-annotation/Dockerfile.dev
    env_file: [apps/ms-annotation/.env]
    ports:
      - "${BACKEND_PORT:-6103}:${BACKEND_PORT:-6103}"
    # The Prisma client is git-ignored: generate it before serving (serve even if it fails, errors show on /crouton/status).
    command: sh -c "pnpm exec crouton generate --yes --cwd apps/ms-annotation; pnpm exec nx run ms-annotation-backend:serve"
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
    environment:
      - NX_COMMAND=ms-annotation-backend:serve
      # .env points at localhost for `pnpm dev`; inside the network use service hostnames
      - DATABASE_URL=postgresql://ms_annotation:dev@postgres:5432/annophis?schema=ms_annotation
      - NATS_URL=nats://nats:4222
      - WATCHPACK_POLLING=true
      - IS_DOCKER=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.nx
    networks: [annophis-net]
