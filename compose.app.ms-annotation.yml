networks:
  annophis-net:
    name: annophis-net

services:
  ms-annotation-backend:
    build:
      context: .
      dockerfile: apps/ms-annotation/Dockerfile.dev
    env_file:
      - apps/ms-annotation/.env.example  # committed dev defaults, so a fresh clone starts
      - { path: apps/ms-annotation/.env, required: false }  # local overrides
    ports:
      - "${BACKEND_PORT:-6103}:${BACKEND_PORT:-6103}"
    # nx serve needs apps/<svc>/.env (created from .env.example on first start). The Prisma client is git-ignored: generate it, apply migrations, then serve (serve even if a step fails; errors show on /crouton/status).
    command: sh -c "[ -f apps/ms-annotation/.env ] || cp apps/ms-annotation/.env.example apps/ms-annotation/.env; pnpm exec crouton generate --yes --cwd apps/ms-annotation; (cd apps/ms-annotation && pnpm exec prisma migrate deploy --config prisma/default/prisma.config.ts); pnpm exec nx run ms-annotation-backend:serve"
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
    environment:
      - NX_COMMAND=ms-annotation-backend:serve
      # .env points at localhost for `pnpm dev`; inside the network use service hostnames
      - DATABASE_URL=postgresql://ms_annotation:dev@postgres:5432/annophis?schema=ms_annotation
      - NATS_URL=nats://nats:4222
      - WATCHPACK_POLLING=true
      - IS_DOCKER=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.nx
    networks: [annophis-net]
