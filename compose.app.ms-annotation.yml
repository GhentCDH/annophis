networks:
  annophis-net:
    name: annophis-net

services:
  ms-annotation-frontend:
    build:
      context: .
      dockerfile: apps/ms-annotation/Dockerfile.dev
    env_file: [apps/ms-annotation/.env]
    ports:
      - "${FRONTEND_PORT:-4203}:${FRONTEND_PORT:-4203}"
    environment:
      - BACKEND_HOST=ms-annotation-backend
      - NX_COMMAND=ms-annotation-frontend:dev
      - WATCHPACK_POLLING=true
      - IS_DOCKER=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.nx
    networks: [annophis-net]
  ms-annotation-backend:
    build:
      context: .
      dockerfile: apps/ms-annotation/Dockerfile.dev
    env_file: [apps/ms-annotation/.env]
    ports:
      - "${BACKEND_PORT:-3003}:${BACKEND_PORT:-3003}"
    # The Prisma client is git-ignored: generate it before serving (serve even if it fails, errors show on /crouton/status).
    command: sh -c "pnpm exec crouton generate --yes --cwd apps/ms-annotation; pnpm exec nx run ms-annotation-backend:serve"
    environment:
      - NX_COMMAND=ms-annotation-backend:serve
      - WATCHPACK_POLLING=true
      - IS_DOCKER=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.nx
    networks: [annophis-net]
