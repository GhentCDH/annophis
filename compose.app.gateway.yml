networks:
  annophis-net:
    name: annophis-net

services:
  gateway-frontend:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile.dev
    env_file: [apps/gateway/.env]
    ports:
      - "${FRONTEND_PORT:-6200}:${FRONTEND_PORT:-6200}"
    environment:
      - BACKEND_HOST=gateway-backend
      - NX_COMMAND=gateway-frontend:dev
      - WATCHPACK_POLLING=true
      - IS_DOCKER=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.nx
    networks: [annophis-net]
  gateway-backend:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile.dev
    env_file: [apps/gateway/.env]
    ports:
      - "${BACKEND_PORT:-6100}:${BACKEND_PORT:-6100}"
    # The Prisma client is git-ignored: generate it, apply migrations, then serve (serve even if a step fails; errors show on /crouton/status).
    command: sh -c "pnpm exec crouton generate --yes --cwd apps/gateway; (cd apps/gateway && pnpm exec prisma migrate deploy --config prisma/default/prisma.config.ts); pnpm exec nx run gateway-backend:serve"
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
    environment:
      - NX_COMMAND=gateway-backend:serve
      # .env points at localhost for `pnpm dev`; inside the network use service hostnames
      - DATABASE_URL=postgresql://gateway:dev@postgres:5432/annophis?schema=gateway
      - NATS_URL=nats://nats:4222
      - WATCHPACK_POLLING=true
      - IS_DOCKER=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.nx
    networks: [annophis-net]
