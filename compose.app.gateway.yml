networks:
  annophis-net:
    name: annophis-net

services:
  gateway-frontend:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile.dev
    env_file: [apps/gateway/.env]
    ports:
      - "${FRONTEND_PORT:-4200}:${FRONTEND_PORT:-4200}"
    environment:
      - BACKEND_HOST=gateway-backend
      - NX_COMMAND=gateway-frontend:dev
      - WATCHPACK_POLLING=true
      - IS_DOCKER=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.nx
    networks: [annophis-net]
  gateway-backend:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile.dev
    env_file: [apps/gateway/.env]
    ports:
      - "${BACKEND_PORT:-3000}:${BACKEND_PORT:-3000}"
    # The Prisma client is git-ignored: generate it before serving (serve even if it fails, errors show on /crouton/status).
    command: sh -c "pnpm exec crouton generate --yes --cwd apps/gateway; pnpm exec nx run gateway-backend:serve"
    environment:
      - NX_COMMAND=gateway-backend:serve
      - WATCHPACK_POLLING=true
      - IS_DOCKER=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.nx
    networks: [annophis-net]
