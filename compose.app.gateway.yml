networks:
  annophis-net:
    name: annophis-net

services:
  gateway-frontend:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile.dev
    env_file:
      - apps/gateway/.env.example  # committed dev defaults, so a fresh clone starts
      - { path: apps/gateway/.env, required: false }  # local overrides
    ports:
      - "${FRONTEND_PORT:-6200}:${FRONTEND_PORT:-6200}"
    environment:
      - BACKEND_HOST=gateway-backend
      - NX_COMMAND=gateway-frontend:dev
      - WATCHPACK_POLLING=true
      - IS_DOCKER=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.nx
    networks: [annophis-net]
  gateway-backend:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile.dev
    env_file:
      - apps/gateway/.env.example  # committed dev defaults, so a fresh clone starts
      - { path: apps/gateway/.env, required: false }  # local overrides
    ports:
      - "${BACKEND_PORT:-6100}:${BACKEND_PORT:-6100}"
    # nx serve needs apps/<svc>/.env (created from .env.example on first start). The Prisma client is git-ignored: generate it, apply migrations, then serve (serve even if a step fails; errors show on /crouton/status).
    command: sh -c "[ -f apps/gateway/.env ] || cp apps/gateway/.env.example apps/gateway/.env; pnpm exec crouton generate --yes --cwd apps/gateway; (cd apps/gateway && pnpm exec prisma migrate deploy --config prisma/default/prisma.config.ts); pnpm exec nx run gateway-backend:serve"
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
    healthcheck:
      # healthy = gateway + every service up and on the bus (GET /health/services)
      test: ["CMD-SHELL", "wget -qO- http://localhost:$${BACKEND_PORT:-6100}/health/services >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40
    environment:
      - NX_COMMAND=gateway-backend:serve
      # .env points at localhost for `pnpm dev`; inside the network use service hostnames
      - DATABASE_URL=postgresql://gateway:dev@postgres:5432/annophis?schema=gateway
      - NATS_URL=nats://nats:4222
      # service backends for the admin facade and /health/services
      - ANNOPHIS_MS_PROJECTS_URL=http://ms-projects-backend:6101
      - ANNOPHIS_MS_CORPORA_URL=http://ms-corpora-backend:6102
      - ANNOPHIS_MS_ANNOTATION_URL=http://ms-annotation-backend:6103
      - ANNOPHIS_MS_METADATA_URL=http://ms-metadata-backend:6104
      - ANNOPHIS_TEXT_SERVICE_1_URL=http://text-service-1-backend:6110
      - ANNOPHIS_TEXT_SERVICE_2_URL=http://text-service-2-backend:6111
      - ANNOPHIS_ML_ADAPTER_URL=http://ml-adapter-backend:6120
      - WATCHPACK_POLLING=true
      - IS_DOCKER=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.nx
    networks: [annophis-net]
